name: Test Run

on:
  workflow_dispatch:
    inputs:
      topics:
        description: 'topics'
        required: false
        default: '3'
      like_rate:
        description: 'like rate 0-100'
        required: false
        default: '0'
      mode:
        description: 'xvfb or headless'
        required: false
        default: 'xvfb'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install DrissionPage
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
      - name: Network check
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          IP=$(curl -s --max-time 15 https://api.ipify.org || echo unknown)
          S1=$(curl -s -o /tmp/l1.html -w '%{http_code}' --max-time 20 -A "$UA" https://linux.do/login || echo err)
          sleep 5
          S2=$(curl -s -o /tmp/l2.html -w '%{http_code}' --max-time 20 -A "$UA" https://linux.do/ || echo err)
          echo "## Network" >> $GITHUB_STEP_SUMMARY
          echo "egress_ip=$IP" >> $GITHUB_STEP_SUMMARY
          echo "curl_login_status=$S1" >> $GITHUB_STEP_SUMMARY
          echo "curl_home_status=$S2" >> $GITHUB_STEP_SUMMARY
          echo "login_body:" >> $GITHUB_STEP_SUMMARY
          head -c 200 /tmp/l1.html >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
      - name: Probe login page
        run: |
          cat > probe.py <<'EOF'
          import time, os
          from DrissionPage import ChromiumPage, ChromiumOptions
          o = ChromiumOptions()
          o.set_argument('--no-sandbox')
          o.set_argument('--disable-dev-shm-usage')
          o.set_argument('--disable-gpu')
          o.set_argument('--window-size=1920,1080')
          p = ChromiumPage(o)
          p.get('https://linux.do/login')
          time.sleep(12)
          os.makedirs('debug', exist_ok=True)
          try:
              p.get_screenshot(path='debug', name='login.png', full_page=True)
          except Exception as e:
              print('screenshot failed:', e)
          h = p.html or ''
          open('debug/login.html', 'w', encoding='utf-8').write(h)
          info = 'TITLE=%s | URL=%s | HTML_LEN=%d | HAS_LOGIN_INPUT=%s' % (p.title, p.url, len(h), 'login-account-name' in h)
          print(info)
          print(h[:2000])
          s = os.environ.get('GITHUB_STEP_SUMMARY')
          if s:
              open(s, 'a', encoding='utf-8').write('## Browser probe' + chr(10) + chr(10) + info + chr(10) + chr(10) + h[:800] + chr(10))
          p.quit()
          EOF
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python probe.py
      - name: Run script
        if: always()
        env:
          LINUXDO_USERNAME: ${{ secrets.LINUXDO_USERNAME }}
          LINUXDO_PASSWORD: ${{ secrets.LINUXDO_PASSWORD }}
        run: |
          T="${{ github.event.inputs.topics || '3' }}"
          L="${{ github.event.inputs.like_rate || '0' }}"
          M="${{ github.event.inputs.mode || 'xvfb' }}"
          echo "mode=$M topics=$T like=$L"
          if [ "$M" = "headless" ]; then
            python linux_do_headless.py --topics "$T" --like-rate "$L" --debug
          else
            xvfb-run -a --server-args="-screen 0 1920x1080x24" python linux_do_headless.py --topics "$T" --like-rate "$L" --debug --no-headless
          fi
      - name: Upload debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
