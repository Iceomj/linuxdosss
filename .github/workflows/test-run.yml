name: Test Run

on:
  workflow_dispatch:
    inputs:
      topics:
        description: 'topics'
        required: false
        default: '3'
      like_rate:
        description: 'like rate 0-100'
        required: false
        default: '0'
      mode:
        description: 'xvfb or headless'
        required: false
        default: 'xvfb'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install DrissionPage
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
      - name: Chrome diagnostics
        run: |
          which google-chrome || echo "no google-chrome"
          google-chrome --version || echo "version failed"
          echo "=== A: direct headless dump-dom ==="
          timeout 60 google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --dump-dom https://example.com > /tmp/dom.html 2>/tmp/a.err && echo "A OK" || echo "A FAILED rc=$?"
          head -c 200 /tmp/dom.html || true
          echo "=== A stderr ==="
          tail -30 /tmp/a.err || true
          echo "=== B: remote debugging port ==="
          rm -rf /tmp/cprof
          nohup google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9333 --user-data-dir=/tmp/cprof about:blank > /tmp/b.log 2>&1 &
          sleep 10
          curl -sS --max-time 10 http://127.0.0.1:9333/json/version && echo "B OK" || echo "B FAILED: port unreachable"
          echo "=== B log ==="
          tail -30 /tmp/b.log || true
          pkill -f "remote-debugging-port=9333" || true
      - name: Run script
        env:
          LINUXDO_USERNAME: ${{ secrets.LINUXDO_USERNAME }}
          LINUXDO_PASSWORD: ${{ secrets.LINUXDO_PASSWORD }}
        run: |
          T="${{ github.event.inputs.topics || '3' }}"
          L="${{ github.event.inputs.like_rate || '0' }}"
          M="${{ github.event.inputs.mode || 'xvfb' }}"
          echo "mode=$M topics=$T like=$L"
          if [ "$M" = "headless" ]; then
            python linux_do_headless.py --topics "$T" --like-rate "$L" --debug
          else
            xvfb-run -a --server-args="-screen 0 1920x1080x24" python linux_do_headless.py --topics "$T" --like-rate "$L" --debug --no-headless
          fi
      - name: Probe login page
        if: always()
        run: |
          cat > probe.py <<'EOF'
          import time, os
          from DrissionPage import ChromiumPage, ChromiumOptions
          o = ChromiumOptions()
          o.set_argument('--no-sandbox')
          o.set_argument('--disable-dev-shm-usage')
          o.set_argument('--disable-gpu')
          o.set_argument('--window-size=1920,1080')
          p = ChromiumPage(o)
          p.get('https://linux.do/login')
          time.sleep(12)
          os.makedirs('debug', exist_ok=True)
          try:
              p.get_screenshot(path='debug', name='login.png', full_page=True)
          except Exception as e:
              print('screenshot failed:', e)
          h = p.html or ''
          open('debug/login.html', 'w', encoding='utf-8').write(h)
          low = h.lower()
          cf = any(m in low for m in ['just a moment', 'cf-chl', 'challenge-platform', 'cf_chl_opt', 'checking your browser'])
          info = 'TITLE=%s | URL=%s | HTML_LEN=%d | CLOUDFLARE=%s | HAS_LOGIN_INPUT=%s' % (p.title, p.url, len(h), cf, 'login-account-name' in h)
          print(info)
          print(h[:2000])
          s = os.environ.get('GITHUB_STEP_SUMMARY')
          if s:
              open(s, 'a', encoding='utf-8').write('## Login probe' + chr(10) + chr(10) + info + chr(10) + chr(10) + h[:1200])
          p.quit()
          EOF
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python probe.py
      - name: Upload debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
